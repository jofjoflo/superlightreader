name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/android-reader

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/reader
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/reader/pnpm-lock.yaml

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build debug APK
        run: pnpm run android:build

      - name: Publish debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: superlight-reader-debug-${{ github.sha }}
          path: apps/reader/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
